name: Refresh GTFS Data

on:
  schedule:
    - cron: "0 20 * * *" # Every day at 04:00 UTC+8
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow pushing changes to the repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: actions/setup-bun@v1
        with:
          bun-version: "latest"

      - name: Install dependencies
        working-directory: scripts
        run: bun ci

      - name: Refresh GTFS
        run: bun scripts/refresh-gtfs.js

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "Refresh GTFS data [skip ci]" || echo "No changes"
          git push
